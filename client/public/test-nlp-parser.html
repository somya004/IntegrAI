<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Parser Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-section {
            background: #f5f5f5;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }
        .response {
            background: #e8f5e8;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            margin: 2px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .service-kyc { background: #3b82f6; color: white; }
        .service-gst { background: #10b981; color: white; }
        .service-payments { background: #8b5cf6; color: white; }
        .service-fraud { background: #ef4444; color: white; }
        .field { background: #6b7280; color: white; }
    </style>
</head>
<body>
    <h1>NLP Requirement Parser Test</h1>
    
    <div class="test-section">
        <h3>Custom Text Test</h3>
        <textarea id="customText" placeholder="Enter your requirement text here...">The system must integrate KYC and GST verification APIs. The KYC integration should support customer identity verification with name, date of birth, PAN number, email, and phone number validation. The GST integration must validate GSTIN and business registration details. Payment processing is required for transaction handling. Optional fraud detection can be added if needed.</textarea>
        <button onclick="testCustomText()">Parse Custom Text</button>
        <div id="custom-response" class="response"></div>
    </div>

    <div class="test-section">
        <h3>Sample Tests</h3>
        <button onclick="testSample1()">Sample 1: Basic Requirements</button>
        <button onclick="testSample2()">Sample 2: Optional Services</button>
        <button onclick="testSample3()">Sample 3: Complex Scenario</button>
        <div id="sample-response" class="response"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5003';

        async function testCustomText() {
            const text = document.getElementById('customText').value;
            if (!text.trim()) {
                alert('Please enter some text to parse');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/parse`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayResult(data.data, 'custom-response');
                } else {
                    document.getElementById('custom-response').textContent = 
                        `Error: ${data.error}`;
                }
            } catch (error) {
                document.getElementById('custom-response').textContent = 
                    `Network Error: ${error.message}`;
            }
        }

        async function testSample1() {
            const sampleText = "The system must integrate KYC and GST verification APIs. The KYC integration should support customer identity verification with name, date of birth, PAN number, email, and phone number validation. The GST integration must validate GSTIN and business registration details. Payment processing is required for transaction handling.";
            
            try {
                const response = await fetch(`${API_BASE}/parse`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: sampleText })
                });
                
                const data = await response.json();
                displayResult(data.data, 'sample-response');
            } catch (error) {
                document.getElementById('sample-response').textContent = 
                    `Error: ${error.message}`;
            }
        }

        async function testSample2() {
            const sampleText = "We need optional fraud detection services if needed. Payment gateway integration is mandatory with Razorpay. Customer verification should include PAN and Aadhaar verification. GST filing can be optional based on business requirements.";
            
            try {
                const response = await fetch(`${API_BASE}/parse`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: sampleText })
                });
                
                const data = await response.json();
                displayResult(data.data, 'sample-response');
            } catch (error) {
                document.getElementById('sample-response').textContent = 
                    `Error: ${error.message}`;
            }
        }

        async function testSample3() {
            const sampleText = "The platform should support multiple payment methods including credit cards and UPI. KYC verification is essential for onboarding. GST compliance is nice to have for tax purposes. Address verification is optional for premium users. Fraud detection is mandatory for high-value transactions.";
            
            try {
                const response = await fetch(`${API_BASE}/parse`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: sampleText })
                });
                
                const data = await response.json();
                displayResult(data.data, 'sample-response');
            } catch (error) {
                document.getElementById('sample-response').textContent = 
                    `Error: ${error.message}`;
            }
        }

        function displayResult(result, elementId) {
            const element = document.getElementById(elementId);
            
            // Create visual summary first
            let html = `
                <h4>📊 Parsing Summary</h4>
                <p><strong>Confidence Score:</strong> ${result.confidence_score}%</p>
                <p><strong>Word Count:</strong> ${result.word_count}</p>
                <p><strong>Processing Time:</strong> ${new Date(result.timestamp).toLocaleString()}</p>
                
                <h4>🔧 Services Detected (${result.services_detected.length})</h4>
                <div>
                    ${result.services_detected.map(service => 
                        `<span class="badge service-${service.toLowerCase()}">${service}</span>`
                    ).join('')}
                </div>
                
                <h4>📝 Fields Detected (${result.fields_detected.length})</h4>
                <div>
                    ${result.fields_detected.map(field => 
                        `<span class="badge field">${field}</span>`
                    ).join('')}
                </div>
                
                <h4>⚡ Service Priority</h4>
                <p><strong>Mandatory:</strong> ${result.mandatory_services.join(', ') || 'None'}</p>
                <p><strong>Optional:</strong> ${result.optional_services.join(', ') || 'None'}</p>
                
                <h4>🔍 Processing Details</h4>
                <p>Service keywords found: ${result.processing_details.total_service_keywords_found}</p>
                <p>Field keywords found: ${result.processing_details.total_field_keywords_found}</p>
                
                <h4>📄 Full JSON Response</h4>
            `;
            
            // Add formatted JSON
            html += `<pre>${JSON.stringify(result, null, 2)}</pre>`;
            
            element.innerHTML = html;
        }
    </script>
</body>
</html>
