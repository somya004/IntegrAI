<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Simulation Engine Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-section {
            background: #f5f5f5;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }
        .response {
            background: #e8f5e8;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .console-output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .console-line {
            margin: 2px 0;
        }
        .console-timestamp {
            color: #858585;
        }
        .console-method {
            color: #569cd6;
        }
        .console-url {
            color: #ce9178;
        }
        .console-status-success {
            color: #4ec9b0;
        }
        .console-status-error {
            color: #f44747;
        }
        .console-status-warning {
            color: #dcdcaa;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        select, input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin: 5px;
        }
        .config-card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #007bff;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-success { background-color: #28a745; }
        .status-error { background-color: #dc3545; }
        .status-warning { background-color: #ffc107; }
        .status-info { background-color: #17a2b8; }
        .simulation-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        .control-group {
            background: white;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>Enhanced Simulation Engine Test</h1>
    
    <div class="test-section">
        <h3>Configuration Selection</h3>
        <div class="simulation-controls">
            <div class="control-group">
                <label for="configSelect">Integration:</label>
                <select id="configSelect">
                    <option value="kyc-karza">KYC - Karza</option>
                    <option value="payments-razorpay">Payments - Razorpay</option>
                    <option value="gst-cleartax">GST - ClearTax</option>
                </select>
            </div>
            <div class="control-group">
                <label for="versionSelect">API Version:</label>
                <select id="versionSelect">
                    <option value="v1">v1 - Basic</option>
                    <option value="v2" selected>v2 - Enhanced</option>
                    <option value="v3">v3 - Advanced</option>
                </select>
            </div>
            <div class="control-group">
                <label for="scenarioSelect">Scenario:</label>
                <select id="scenarioSelect">
                    <option value="success" selected>Success (70%)</option>
                    <option value="failure">Failure (20%)</option>
                    <option value="timeout">Timeout (5%)</option>
                    <option value="server_error">Server Error (5%)</option>
                </select>
            </div>
        </div>
        
        <div style="margin: 15px 0;">
            <button onclick="runSimulation()" id="runBtn">Run Simulation</button>
            <button onclick="rollbackVersion()" id="rollbackBtn" disabled>Rollback</button>
            <button onclick="clearConsole()">Clear Console</button>
            <button onclick="loadHistory()">Load History</button>
        </div>
        
        <div id="currentStatus" class="config-card" style="display: none;">
            <h4>Current Simulation Status</h4>
            <div id="statusContent"></div>
        </div>
    </div>

    <div class="test-section">
        <h3>Console Output</h3>
        <div id="consoleOutput" class="console-output">
            <div class="console-line">
                <span class="console-timestamp">[System]</span> Enhanced Simulation Engine ready. Select a configuration and run a simulation.
            </div>
        </div>
    </div>

    <div class="test-section">
        <h3>API Test</h3>
        <button onclick="testHealthCheck()">Health Check</button>
        <button onclick="testVersions()">Get Versions</button>
        <button onclick="testScenarios()">Get Scenarios</button>
        <button onclick="testStats()">Get Statistics</button>
        <div id="api-response" class="response"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5006';
        let currentSnapshotId = null;
        let simulationCount = 0;

        const sampleConfigs = {
            'kyc-karza': {
                id: 'kyc-karza',
                service: 'KYC',
                provider: 'Karza',
                version: 'v2',
                status: 'active',
                config: {
                    endpoints: {
                        verify: 'https://api.karza.in/v2/kyc/verify',
                        status: 'https://api.karza.in/v2/kyc/status',
                        enhanced: 'https://api.karza.in/v2/kyc/enhanced'
                    },
                    authentication: {
                        type: 'API Key',
                        header: 'X-API-Key',
                        credentials: {
                            api_key: 'karza_api_key_12345'
                        }
                    },
                    rate_limit: {
                        requests: 200,
                        period: 'minute'
                    },
                    required_fields: ['panNumber', 'aadhaarNumber', 'fullName', 'dateOfBirth', 'mobileNumber']
                }
            },
            'payments-razorpay': {
                id: 'payments-razorpay',
                service: 'Payments',
                provider: 'Razorpay',
                version: 'v2',
                status: 'active',
                config: {
                    endpoints: {
                        create: 'https://api.razorpay.com/v2/payments',
                        capture: 'https://api.razorpay.com/v2/payments/:id/capture',
                        refund: 'https://api.razorpay.com/v2/payments/:id/refund',
                        webhooks: 'https://api.razorpay.com/v2/webhooks'
                    },
                    authentication: {
                        type: 'Bearer Token',
                        header: 'Authorization',
                        credentials: {
                            token: 'rzp_test_token_67890'
                        }
                    },
                    rate_limit: {
                        requests: 500,
                        period: 'minute'
                    },
                    required_fields: ['amount', 'currency', 'receipt', 'notes', 'callbackUrl']
                }
            },
            'gst-cleartax': {
                id: 'gst-cleartax',
                service: 'GST',
                provider: 'ClearTax',
                version: 'v2',
                status: 'active',
                config: {
                    endpoints: {
                        verify: 'https://api.cleartax.in/v2/gst/verify',
                        details: 'https://api.cleartax.in/v2/gst/details',
                        returns: 'https://api.cleartax.in/v2/gst/returns'
                    },
                    authentication: {
                        type: 'API Key',
                        header: 'X-API-Key',
                        credentials: {
                            api_key: 'cleartax_api_key_54321'
                        }
                    },
                    rate_limit: {
                        requests: 100,
                        period: 'minute'
                    },
                    required_fields: ['gstin', 'businessName', 'state', 'registrationType']
                }
            }
        };

        function addConsoleLine(message, type = 'info') {
            const consoleOutput = document.getElementById('consoleOutput');
            const timestamp = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = 'console-line';
            
            if (type === 'request') {
                line.innerHTML = `<span class="console-timestamp">[${timestamp}]</span> <span class="console-method">${message.method}</span> <span class="console-url">${message.url}</span>`;
            } else if (type === 'response') {
                const statusClass = message.status >= 200 && message.status < 300 ? 'console-status-success' : 
                                  message.status >= 400 ? 'console-status-error' : 'console-status-warning';
                line.innerHTML = `<span class="console-timestamp">[${timestamp}]</span> <span class="${statusClass}">${message.status} ${message.statusText}</span>`;
            } else if (type === 'details') {
                line.innerHTML = `<span class="console-timestamp">[${timestamp}]</span> <span style="color: #858585;">${message}</span>`;
            } else {
                line.innerHTML = `<span class="console-timestamp">[${timestamp}]</span> ${message}`;
            }
            
            consoleOutput.appendChild(line);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        async function runSimulation() {
            const configKey = document.getElementById('configSelect').value;
            const version = document.getElementById('versionSelect').value;
            const scenario = document.getElementById('scenarioSelect').value;
            const config = sampleConfigs[configKey];
            
            const runBtn = document.getElementById('runBtn');
            const rollbackBtn = document.getElementById('rollbackBtn');
            
            runBtn.disabled = true;
            rollbackBtn.disabled = true;
            
            addConsoleLine(`Starting simulation for ${config.service} - ${config.provider} (${version})`, 'info');
            addConsoleLine({ method: 'POST', url: config.config.endpoints.verify || config.config.endpoints.create }, 'request');
            
            try {
                const response = await fetch(`${API_BASE}/simulate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        config: config,
                        version: version,
                        scenario: scenario
                    }),
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const simulation = data.data.simulation;
                    currentSnapshotId = data.data.snapshot_id;
                    
                    addConsoleLine({ 
                        status: simulation.response.status, 
                        statusText: simulation.response.statusText 
                    }, 'response');
                    
                    addConsoleLine(`Version: ${simulation.version} | Scenario: ${simulation.scenario} | Response Time: ${simulation.performance.request_time}ms`, 'details');
                    
                    if (simulation.response.body.success) {
                        addConsoleLine(`✅ Transaction ID: ${simulation.response.body.data.transaction_id}`, 'details');
                    } else {
                        addConsoleLine(`❌ Error: ${simulation.response.body.error?.message || 'Unknown error'}`, 'details');
                    }
                    
                    updateCurrentStatus(simulation);
                    rollbackBtn.disabled = false;
                    
                    simulationCount++;
                    addConsoleLine(`Simulation #${simulationCount} completed successfully`, 'info');
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                addConsoleLine(`❌ Simulation failed: ${error.message}`, 'error');
                addConsoleLine({ status: 500, statusText: 'Simulation Error' }, 'response');
            } finally {
                runBtn.disabled = false;
            }
        }

        async function rollbackVersion() {
            if (!currentSnapshotId) {
                addConsoleLine('❌ No snapshot available for rollback', 'error');
                return;
            }
            
            addConsoleLine('Initiating rollback...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/rollback`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        snapshot_id: currentSnapshotId
                    }),
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addConsoleLine(`✅ Rollback successful: ${data.data.rolled_back_to} (from ${data.data.from_version})`, 'info');
                    currentSnapshotId = null;
                    document.getElementById('rollbackBtn').disabled = true;
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                addConsoleLine(`❌ Rollback failed: ${error.message}`, 'error');
            }
        }

        function updateCurrentStatus(simulation) {
            const statusDiv = document.getElementById('currentStatus');
            const statusContent = document.getElementById('statusContent');
            
            const statusClass = simulation.success ? 'status-success' : 'status-error';
            const statusText = simulation.success ? 'Success' : 'Failed';
            
            statusContent.innerHTML = `
                <div style="display: flex; align-items: center; margin-bottom: 10px;">
                    <span class="status-indicator ${statusClass}"></span>
                    <strong>${statusText}</strong> - ${simulation.response.statusText}
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px;">
                    <div><strong>Service:</strong> ${simulation.service}</div>
                    <div><strong>Version:</strong> ${simulation.version}</div>
                    <div><strong>Scenario:</strong> ${simulation.scenario}</div>
                    <div><strong>Response Time:</strong> ${simulation.performance.request_time}ms</div>
                    <div><strong>Status Code:</strong> ${simulation.response.status}</div>
                    <div><strong>Response Size:</strong> ${simulation.performance.response_size} bytes</div>
                </div>
            `;
            
            statusDiv.style.display = 'block';
        }

        function clearConsole() {
            const consoleOutput = document.getElementById('consoleOutput');
            consoleOutput.innerHTML = '<div class="console-line"><span class="console-timestamp">[System]</span> Console cleared.</div>';
            document.getElementById('currentStatus').style.display = 'none';
        }

        async function loadHistory() {
            const configKey = document.getElementById('configSelect').value;
            const config = sampleConfigs[configKey];
            
            addConsoleLine(`Loading simulation history for ${config.service} - ${config.provider}...`, 'info');
            
            try {
                const response = await fetch(`${API_BASE}/simulations/${config.id}`);
                const data = await response.json();
                
                if (data.success) {
                    addConsoleLine(`Found ${data.data.total_count} simulations`, 'info');
                    addConsoleLine(`Current version: ${data.data.current_version}`, 'details');
                    
                    data.data.history.forEach((sim, index) => {
                        const statusClass = sim.success ? 'console-status-success' : 'console-status-error';
                        addConsoleLine(`History #${index + 1}: ${sim.version} - ${sim.scenario} - ${sim.response.status}`, 'details');
                    });
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                addConsoleLine(`❌ Failed to load history: ${error.message}`, 'error');
            }
        }

        async function testHealthCheck() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                document.getElementById('api-response').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('api-response').textContent = `Error: ${error.message}`;
            }
        }

        async function testVersions() {
            try {
                const response = await fetch(`${API_BASE}/versions`);
                const data = await response.json();
                document.getElementById('api-response').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('api-response').textContent = `Error: ${error.message}`;
            }
        }

        async function testScenarios() {
            try {
                const response = await fetch(`${API_BASE}/scenarios`);
                const data = await response.json();
                document.getElementById('api-response').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('api-response').textContent = `Error: ${error.message}`;
            }
        }

        async function testStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();
                document.getElementById('api-response').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('api-response').textContent = `Error: ${error.message}`;
            }
        }

        // Initialize
        window.onload = function() {
            addConsoleLine('Enhanced Simulation Engine initialized', 'info');
            addConsoleLine('Available configurations: KYC (Karza), Payments (Razorpay), GST (ClearTax)', 'info');
        };
    </script>
</body>
</html>
