<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Tenant Service Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-section {
            background: #f5f5f5;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }
        .response {
            background: #e8f5e8;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        .tenant-card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #007bff;
        }
        .integration-item {
            background: #f8f9fa;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            border-left: 3px solid #28a745;
        }
        .status-active { border-left-color: #28a745; }
        .status-inactive { border-left-color: #6c757d; }
        .status-error { border-left-color: #dc3545; }
        .tenant-selector {
            margin: 15px 0;
        }
        .tenant-selector select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Multi-Tenant Service Test</h1>
    
    <div class="test-section">
        <h3>Tenant Management</h3>
        <button onclick="testGetAllTenants()">Get All Tenants</button>
        <button onclick="testGetTenantConfig()">Get Current Tenant Config</button>
        <div id="tenant-response" class="response"></div>
    </div>

    <div class="test-section">
        <h3>Integration Management</h3>
        <div class="tenant-selector">
            <label for="tenantSelect">Select Tenant:</label>
            <select id="tenantSelect">
                <option value="bank_a">Bank A</option>
                <option value="bank_b">Bank B</option>
                <option value="fintech_x">Fintech X</option>
            </select>
        </div>
        <button onclick="testGetIntegrations()">Get Integrations</button>
        <button onclick="testAddIntegration()">Add Integration</button>
        <button onclick="testUpdateIntegration()">Update Integration</button>
        <button onclick="testRemoveIntegration()">Remove Integration</button>
        <div id="integration-response" class="response"></div>
    </div>

    <div class="test-section">
        <h3>Audit Logs</h3>
        <button onclick="testGetAuditLogs()">Get Audit Logs</button>
        <button onclick="testAddAuditLog()">Add Audit Log</button>
        <div id="audit-response" class="response"></div>
    </div>

    <div class="test-section">
        <h3>Settings Management</h3>
        <button onclick="testGetSettings()">Get Settings</button>
        <button onclick="testUpdateSettings()">Update Settings</button>
        <div id="settings-response" class="response"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5005';

        function getSelectedTenant() {
            return document.getElementById('tenantSelect').value;
        }

        async function testGetAllTenants() {
            try {
                const response = await fetch(`${API_BASE}/tenants`);
                const data = await response.json();
                
                if (data.success) {
                    displayTenants(data.data, 'tenant-response');
                } else {
                    document.getElementById('tenant-response').textContent = 
                        `Error: ${data.error}`;
                }
            } catch (error) {
                document.getElementById('tenant-response').textContent = 
                    `Error: ${error.message}`;
            }
        }

        async function testGetTenantConfig() {
            const tenantId = getSelectedTenant();
            
            try {
                const response = await fetch(`${API_BASE}/tenants/${tenantId}`);
                const data = await response.json();
                
                if (data.success) {
                    displayTenantConfig(data.data, 'tenant-response');
                } else {
                    document.getElementById('tenant-response').textContent = 
                        `Error: ${data.error}`;
                }
            } catch (error) {
                document.getElementById('tenant-response').textContent = 
                    `Error: ${error.message}`;
            }
        }

        async function testGetIntegrations() {
            const tenantId = getSelectedTenant();
            
            try {
                const response = await fetch(`${API_BASE}/tenants/${tenantId}/integrations`);
                const data = await response.json();
                
                if (data.success) {
                    displayIntegrations(data.data, 'integration-response');
                } else {
                    document.getElementById('integration-response').textContent = 
                        `Error: ${data.error}`;
                }
            } catch (error) {
                document.getElementById('integration-response').textContent = 
                    `Error: ${error.message}`;
            }
        }

        async function testAddIntegration() {
            const tenantId = getSelectedTenant();
            
            const newIntegration = {
                id: 'test-integration-' + Date.now(),
                service: 'KYC',
                provider: 'Test Provider',
                version: 'v1',
                config: {
                    endpoints: {
                        verify: 'https://api.test.com/v1/verify',
                        status: 'https://api.test.com/v1/status'
                    },
                    authentication: {
                        type: 'API Key',
                        header: 'X-API-Key',
                        credentials: {
                            api_key: 'test_api_key_12345'
                        }
                    },
                    rate_limit: {
                        requests: 100,
                        period: 'minute'
                    },
                    required_fields: ['testField1', 'testField2'],
                    webhook_url: 'https://test.com/webhooks'
                }
            };
            
            try {
                const response = await fetch(`${API_BASE}/tenants/${tenantId}/integrations`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newIntegration)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('integration-response').innerHTML = `
                        <h4>✅ Integration Added Successfully</h4>
                        <p><strong>ID:</strong> ${data.data.id}</p>
                        <p><strong>Service:</strong> ${data.data.service}</p>
                        <p><strong>Provider:</strong> ${data.data.provider}</p>
                        <p><strong>Version:</strong> ${data.data.version}</p>
                        <p><strong>Status:</strong> ${data.data.status}</p>
                    `;
                } else {
                    document.getElementById('integration-response').textContent = 
                        `Error: ${data.error}`;
                }
            } catch (error) {
                document.getElementById('integration-response').textContent = 
                    `Error: ${error.message}`;
            }
        }

        async function testUpdateIntegration() {
            const tenantId = getSelectedTenant();
            const integrationId = 'test-integration-' + Date.now();
            
            // First add an integration to update
            await testAddIntegration();
            
            setTimeout(async () => {
                const updates = {
                    status: 'inactive',
                    config: {
                        rate_limit: {
                            requests: 200,
                            period: 'minute'
                        }
                    }
                };
                
                try {
                    const response = await fetch(`${API_BASE}/tenants/${tenantId}/integrations/${integrationId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(updates)
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        document.getElementById('integration-response').innerHTML = `
                            <h4>✅ Integration Updated Successfully</h4>
                            <p><strong>ID:</strong> ${data.data.id}</p>
                            <p><strong>Status:</strong> ${data.data.status}</p>
                            <p><strong>Updated At:</strong> ${data.data.updated_at}</p>
                        `;
                    } else {
                        document.getElementById('integration-response').textContent = 
                            `Error: ${data.error}`;
                    }
                } catch (error) {
                    document.getElementById('integration-response').textContent = 
                        `Error: ${error.message}`;
                }
            }, 1000);
        }

        async function testRemoveIntegration() {
            const tenantId = getSelectedTenant();
            const integrationId = 'test-integration-' + Date.now();
            
            // First add an integration to remove
            await testAddIntegration();
            
            setTimeout(async () => {
                try {
                    const response = await fetch(`${API_BASE}/tenants/${tenantId}/integrations/${integrationId}`, {
                        method: 'DELETE'
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        document.getElementById('integration-response').innerHTML = `
                            <h4>✅ Integration Removed Successfully</h4>
                            <p><strong>ID:</strong> ${data.data.id}</p>
                            <p><strong>Service:</strong> ${data.data.service}</p>
                            <p><strong>Provider:</strong> ${data.data.provider}</p>
                        `;
                    } else {
                        document.getElementById('integration-response').textContent = 
                            `Error: ${data.error}`;
                    }
                } catch (error) {
                    document.getElementById('integration-response').textContent = 
                        `Error: ${error.message}`;
                }
            }, 1000);
        }

        async function testGetAuditLogs() {
            const tenantId = getSelectedTenant();
            
            try {
                const response = await fetch(`${API_BASE}/tenants/${tenantId}/audit-logs?limit=10`);
                const data = await response.json();
                
                if (data.success) {
                    displayAuditLogs(data.data, 'audit-response');
                } else {
                    document.getElementById('audit-response').textContent = 
                        `Error: ${data.error}`;
                }
            } catch (error) {
                document.getElementById('audit-response').textContent = 
                    `Error: ${error.message}`;
            }
        }

        async function testAddAuditLog() {
            const tenantId = getSelectedTenant();
            
            const logEntry = {
                action: 'test_action',
                details: {
                    test_field: 'test_value',
                    timestamp: new Date().toISOString(),
                    user: 'test_user'
                }
            };
            
            try {
                const response = await fetch(`${API_BASE}/tenants/${tenantId}/audit-logs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(logEntry)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('audit-response').innerHTML = `
                        <h4>✅ Audit Log Added Successfully</h4>
                        <p><strong>Action:</strong> ${logEntry.action}</p>
                        <p><strong>Details:</strong> ${JSON.stringify(logEntry.details, null, 2)}</p>
                    `;
                } else {
                    document.getElementById('audit-response').textContent = 
                        `Error: ${data.error}`;
                }
            } catch (error) {
                document.getElementById('audit-response').textContent = 
                    `Error: ${error.message}`;
            }
        }

        async function testGetSettings() {
            const tenantId = getSelectedTenant();
            
            try {
                const response = await fetch(`${API_BASE}/tenants/${tenantId}`);
                const data = await response.json();
                
                if (data.success) {
                    displaySettings(data.data.settings, 'settings-response');
                } else {
                    document.getElementById('settings-response').textContent = 
                        `Error: ${data.error}`;
                }
            } catch (error) {
                document.getElementById('settings-response').textContent = 
                    `Error: ${error.message}`;
            }
        }

        async function testUpdateSettings() {
            const tenantId = getSelectedTenant();
            
            const settings = {
                api_timeout: 35000,
                retry_attempts: 5,
                webhook_timeout: 15000,
                notification_settings: {
                    email: false,
                    sms: true,
                    slack: true
                }
            };
            
            try {
                const response = await fetch(`${API_BASE}/tenants/${tenantId}/settings`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(settings)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displaySettings(data.data, 'settings-response');
                } else {
                    document.getElementById('settings-response').textContent = 
                        `Error: ${data.error}`;
                }
            } catch (error) {
                document.getElementById('settings-response').textContent = 
                    `Error: ${error.message}`;
            }
        }

        function displayTenants(tenants, elementId) {
            const element = document.getElementById(elementId);
            
            let html = `<h4>🏢 All Tenants (${tenants.length})</h4>`;
            
            tenants.forEach(tenant => {
                html += `
                    <div class="tenant-card">
                        <h5>${tenant.tenant_name}</h5>
                        <p><strong>ID:</strong> ${tenant.tenant_id}</p>
                        <p><strong>Type:</strong> ${tenant.tenant_type}</p>
                        <p><strong>Created:</strong> ${new Date(tenant.created_at).toLocaleString()}</p>
                        <p><strong>Integrations:</strong> ${tenant.integration_count} (${tenant.active_integrations} active)</p>
                    </div>
                `;
            });
            
            element.innerHTML = html;
        }

        function displayTenantConfig(config, elementId) {
            const element = document.getElementById(elementId);
            
            let html = `
                <h4>🏢 ${config.tenant_name} Configuration</h4>
                <p><strong>Tenant ID:</strong> ${config.tenant_id}</p>
                <p><strong>Type:</strong> ${config.tenant_type}</p>
                <p><strong>Created:</strong> ${new Date(config.created_at).toLocaleString()}</p>
                <p><strong>Integrations:</strong> ${config.integrations.length}</p>
                <p><strong>Audit Logs:</strong> ${config.audit_logs.length}</p>
            `;
            
            element.innerHTML = html;
        }

        function displayIntegrations(integrations, elementId) {
            const element = document.getElementById(elementId);
            
            let html = `<h4>🔌 Integrations (${integrations.length})</h4>`;
            
            integrations.forEach(integration => {
                const statusClass = `status-${integration.status}`;
                html += `
                    <div class="integration-item ${statusClass}">
                        <h5>${integration.service} - ${integration.provider}</h5>
                        <p><strong>ID:</strong> ${integration.id}</p>
                        <p><strong>Version:</strong> ${integration.version}</p>
                        <p><strong>Status:</strong> ${integration.status}</p>
                        <p><strong>Created:</strong> ${new Date(integration.created_at).toLocaleString()}</p>
                        <p><strong>Authentication:</strong> ${integration.config.authentication.type}</p>
                        <p><strong>Rate Limit:</strong> ${integration.config.rate_limit.requests} requests/${integration.config.rate_limit.period}</p>
                    </div>
                `;
            });
            
            element.innerHTML = html;
        }

        function displayAuditLogs(logs, elementId) {
            const element = document.getElementById(elementId);
            
            let html = `<h4>📋 Audit Logs (${logs.length})</h4>`;
            
            if (logs.length === 0) {
                html += '<p>No audit logs found</p>';
            } else {
                logs.forEach(log => {
                    html += `
                        <div class="integration-item">
                            <h5>${log.action}</h5>
                            <p><strong>Timestamp:</strong> ${new Date(log.timestamp).toLocaleString()}</p>
                            <p><strong>Tenant ID:</strong> ${log.tenant_id}</p>
                            <p><strong>Details:</strong> <pre>${JSON.stringify(log.details, null, 2)}</pre></p>
                        </div>
                    `;
                });
            }
            
            element.innerHTML = html;
        }

        function displaySettings(settings, elementId) {
            const element = document.getElementById(elementId);
            
            let html = `
                <h4>⚙️ Settings</h4>
                <p><strong>API Timeout:</strong> ${settings.api_timeout}ms</p>
                <p><strong>Retry Attempts:</strong> ${settings.retry_attempts}</p>
                <p><strong>Webhook Timeout:</strong> ${settings.webhook_timeout}ms</p>
                <h5>Notification Settings:</h5>
                <p><strong>Email:</strong> ${settings.notification_settings.email ? '✅' : '❌'}</p>
                <p><strong>SMS:</strong> ${settings.notification_settings.sms ? '✅' : '❌'}</p>
                <p><strong>Slack:</strong> ${settings.notification_settings.slack ? '✅' : '❌'}</p>
            `;
            
            element.innerHTML = html;
        }

        // Load initial data
        window.onload = function() {
            testGetAllTenants();
        };
    </script>
</body>
</html>
